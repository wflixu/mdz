[package]
name = "mdz"
version = "1.0.0"
edition = "2024"
description = "CLI tool for MDZ (Markdown Zip) format - packs and unpacks markdown documents with embedded assets"
license = "MIT"
repository = "https://github.com/wflixu/mdz"
homepage = "https://github.com/wflixu/mdz"
keywords = ["markdown", "zip", "cli", "mdz", "archive"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
mdz-rs = { version = "1.0.0", path = "../mdz-rs" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"         # 用于测试中解析 JSON

[dev-dependencies]
assert_cmd = "2.0"      # 用于测试 CLI 命令
predicates = "3.0"       # 用于断言 predicates
tempfile = "3.8"         # 临时文件/目录创建